{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | ServiceHub</title>

    <link rel="stylesheet"
          href="{% static 'css/admin_login.css' %}">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            Service<span>Hub</span>
        </div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            Sign in to manage ServiceHub
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>

                <input type="text"
                       name="username"
                       placeholder="Enter admin username"
                       required>
            </div>

            <div class="form-group">
                <label>Password</label>

                <input type="password"
                       name="password"
                       placeholder="Enter password"
                       required>
            </div>

            <button type="submit">
                Login to Admin
            </button>

        </form>

        <a href="{% url 'home' %}" class="back-home">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
