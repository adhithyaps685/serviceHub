{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | ServiceHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'css/worker.css' %}">
</head>

<body>

<nav class="navbar worker-navbar">
    <div class="container">
        <a class="navbar-brand service-logo"
           href="{% url 'home' %}">
            Service<span>Hub</span>
        </a>

        <a href="{% url 'worker' %}"
           class="btn btn-outline-light">
            Back to Dashboard
        </a>
    </div>
</nav>


<section class="worker-dashboard py-5">

    <div class="container">

        <div class="section-heading mb-4">
            <div>
                <span class="section-label">
                    Edit Account
                </span>

                <h2>Edit Worker Profile</h2>
            </div>
        </div>


        <div class="profile-card">

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">
                        Full Name
                    </label>

                    <input type="text"
                           name="name"
                           class="form-control"
                           value="{{ worker.user.get_full_name }}"
                           required>
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           class="form-control"
                           value="{{ worker.user.email }}"
                           readonly>
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        Phone
                    </label>

                    <input type="text"
                           name="phone"
                           class="form-control"
                           value="{{ worker.phone }}"
                           required>
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        Place
                    </label>

                    <input type="text"
                           name="place"
                           class="form-control"
                           value="{{ worker.place }}"
                           required>
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        Experience (Years)
                    </label>

                    <input type="number"
                           name="experience"
                           class="form-control"
                           value="{{ worker.experience }}"
                           min="0"
                           required>
                </div>


                <div class="mb-4">
                    <label class="form-label">
                        Description
                    </label>

                    <textarea name="description"
                              class="form-control"
                              rows="5">{{ worker.description }}</textarea>
                </div>


                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary">
                        <i class="fa-solid fa-save"></i>
                        Save Changes
                    </button>

                    <a href="{% url 'worker' %}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</section>


<footer class="worker-footer">
    <div class="container">
        <p>
            © 2026 <strong>ServiceHub</strong>.
            Professional Home & Vehicle Services.
        </p>
    </div>
</footer>

</body>
</html>
