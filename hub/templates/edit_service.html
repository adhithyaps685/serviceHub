{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Service | ServiceHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .edit-container {
            max-width: 700px;
            margin: 60px auto;
        }

        .edit-card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .edit-title {
            color: #173b70;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            color: #294a75;
        }

        .form-control,
        .form-select {
            border-radius: 9px;
            padding: 11px 13px;
        }

        .btn-update {
            background: #2161d1;
            border: none;
            color: white;
            padding: 11px 22px;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-update:hover {
            background: #174da9;
            color: white;
        }

        .btn-cancel {
            background: #e9edf3;
            color: #40536d;
            padding: 11px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }

        .btn-cancel:hover {
            background: #dce2ea;
            color: #263f63;
        }

    </style>

</head>

<body>

<div class="edit-container">

    <div class="edit-card">

        <h1 class="edit-title">
            Edit Service
        </h1>

        <form method="POST">

            {% csrf_token %}

            <!-- SERVICE NAME -->

            <div class="mb-3">

                <label class="form-label">
                    Service Name
                </label>

                <input type="text"
                       name="name"
                       class="form-control"
                       value="{{ service.name }}"
                       required>

            </div>


            <!-- CATEGORY -->

            <div class="mb-3">

                <label class="form-label">
                    Category
                </label>

                <select name="category"
                        class="form-select"
                        required>

                    <option value="Home"
                        {% if service.category == "Home" %}
                            selected
                        {% endif %}>
                        Home
                    </option>

                    <option value="Vehicle"
                        {% if service.category == "Vehicle" %}
                            selected
                        {% endif %}>
                        Vehicle
                    </option>

                </select>

            </div>


            <!-- DESCRIPTION -->

            <div class="mb-4">

                <label class="form-label">
                    Description
                </label>

                <textarea name="description"
                          class="form-control"
                          rows="5"
                          required>{{ service.description }}</textarea>

            </div>


            <!-- BUTTONS -->

            <button type="submit"
                    class="btn-update">
                Update Service
            </button>

            <a href="{% url 'service_management' %}"
               class="btn-cancel">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>

</html>
