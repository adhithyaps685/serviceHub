{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Worker Login | ServiceHub</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{% static 'css/worker_login.css' %}">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="top-navbar">

    <div class="brand">

        <i class="fa-solid fa-house"></i>

        <span>ServiceHub</span>

    </div>


    <a href="{% url 'home' %}"
       class="home-btn">

        <i class="fa-solid fa-arrow-left"></i>

        Back to Home

    </a>

</nav>



<!-- ================= LOGIN SECTION ================= -->

<section class="login-section">

    <div class="login-card">


        <!-- ICON -->

        <div class="login-icon">

            <i class="fa-solid fa-user-gear"></i>

        </div>


        <!-- TITLE -->

        <h1>
            Worker Login
        </h1>

        <p class="login-subtitle">
            Login to manage your ServiceHub services.
        </p>



        <!-- DJANGO MESSAGES -->

        {% if messages %}

            {% for message in messages %}

                <div class="login-message">

                    <i class="fa-solid fa-circle-exclamation"></i>

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}



        <!-- LOGIN FORM -->

        <form method="POST"
              id="workerLoginForm">

            {% csrf_token %}


            <!-- EMAIL -->

            <div class="form-group">

                <label for="loginEmail">
                    Email Address
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-envelope"></i>

                    <input type="email"
                           id="loginEmail"
                           name="email"
                           placeholder="Enter your email">

                </div>

                <small id="loginEmailError"
                       class="field-error"></small>

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password"
                           id="loginPassword"
                           name="password"
                           placeholder="Enter your password">

                </div>

                <small id="loginPasswordError"
                       class="field-error"></small>

            </div>



            <!-- LOGIN BUTTON -->

            <button type="submit"
                    class="login-btn">

                <i class="fa-solid fa-right-to-bracket"></i>

                Login

            </button>

        </form>



        <!-- REGISTER -->

        <div class="register-link">

            Don't have a worker account?

            <a href="{% url 'worker_register' %}">
                Register here
            </a>

        </div>


    </div>

</section>



<!-- ================= JAVASCRIPT VALIDATION ================= -->

<script>

const loginForm =
    document.getElementById("workerLoginForm");


loginForm.addEventListener("submit", function(event) {

    let valid = true;


    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;


    const emailError =
        document.getElementById("loginEmailError");

    const passwordError =
        document.getElementById("loginPasswordError");


    // Clear old errors

    emailError.textContent = "";
    passwordError.textContent = "";


    // EMAIL

    if (email === "") {

        emailError.textContent =
            "Email address is required.";

        valid = false;

    }
    else {

        const emailPattern =
            /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;


        if (!emailPattern.test(email)) {

            emailError.textContent =
                "Enter a valid email address.";

            valid = false;
        }

    }


    // PASSWORD

    if (password === "") {

        passwordError.textContent =
            "Password is required.";

        valid = false;
    }


    // STOP FORM

    if (!valid) {

        event.preventDefault();

    }

});

</script>


</body>
</html>
